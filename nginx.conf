log_format json_combined escape=json
  '{'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"request_method":"$request_method",'
  '"request_uri":"$request_uri",'
  '"status":$status,'
  '"request_time":$request_time,'
  '"body_bytes_sent":$body_bytes_sent'
  '}';

# No otel_exporter/otel_trace here — this stage is metrics-only, and there
# is no otel-collector on this network. nginx resolves a static (i.e.
# non-variable) proxy/upstream hostname once, at startup — if that
# resolution fails outright (no such service at all, not just temporarily
# unreachable), nginx refuses to start entirely rather than degrading
# gracefully, so this is a removal, not a toggle.
#
# VTS tracks traffic across every server block in this
# http context by shared zone, itself included — the internal status server
# below shows up too, at low/negligible volume (scrape traffic only).
# Histogram buckets are NOT populated by default (no _bucket/_sum/_count
# output at all without this) — set to match the backend's own
# http_request_duration_seconds buckets (prom-client's defaults, see
# expense-backend-v1.1/src/metrics.js) so the two histograms in the Grafana
# comparison panel are apples-to-apples.
vhost_traffic_status_zone;
vhost_traffic_status_histogram_buckets 0.005 0.01 0.025 0.05 0.1 0.25 0.5 1 2.5 5 10;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Declared here (server level), not at the top of this file (http level):
    # this file is included inside the base image's http{} block, which
    # already has its own default access_log — nginx *adds* additional
    # access_log directives at the same level rather than replacing them, so
    # putting ours at http level would double-log every request. Setting it
    # per-server overrides the inherited default instead.
    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Internal-only: stub_status for nginx-prometheus-exporter. Port 8080 is never
# published to the host in docker-compose, so it's reachable only from other
# containers on the same Docker network — not the public internet.
server {
    listen 8080;
    server_name _;

    # Scraped every 15s by nginx-exporter — not real traffic, so skip logging
    # it rather than filling stdout with noise on every scrape.
    access_log off;

    location /stub_status {
        stub_status;
    }

    # Confirmed against the module's own source
    # (ngx_http_vhost_traffic_status_display_prometheus.h) and README:
    # vhost_traffic_status_display_format prometheus is served at
    # /status/format/prometheus, not /status/prometheus (an easy path to
    # guess wrong). Placed on this internal-only server rather than the
    # public port-80 one, same reasoning stub_status above already follows
    # — not for public internet exposure.
    location /status/format/prometheus {
        vhost_traffic_status_display;
        vhost_traffic_status_display_format prometheus;
    }

    location / {
        return 404;
    }
}
